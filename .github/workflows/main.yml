name: Run Pixi on macOS

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  Run-pixi-on-macOS:
    name: Run pixi on macOS
    runs-on: macos-latest

    steps:
      - name: Install Pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | sh
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"

      - name: Check Pixi version
        run: |
          pixi --version

      - name: Download AzurLaneAutoScript source
        run: |
          curl -L https://github.com/LmeSzinc/AzurLaneAutoScript/archive/refs/heads/master.tar.gz -o alas.tar.gz
          tar -xzf alas.tar.gz
          mv AzurLaneAutoScript-master AzurLaneAutoScript

      - name: Download pixi.toml
        working-directory: AzurLaneAutoScript
        run: |
          curl -L \
            https://raw.githubusercontent.com/guoh064/Linux-X86-Conda-or-Pixi-ALAS/osx-arm64/Pixi/pixi.toml \
            -o pixi.toml

      - name: Install Pixi environment
        working-directory: AzurLaneAutoScript
        run: |
          pixi install -v

      - name: Verify conda-managed tools
        working-directory: AzurLaneAutoScript
        run: |
          pixi run git --version
          pixi run wget --version
          pixi run python --version
          pixi run which git
          pixi run which wget
          pixi run which python

      - name: Configure deploy.yaml
        working-directory: AzurLaneAutoScript
        run: |
          cp config/deploy.template-linux-cn.yaml config/deploy.yaml

      - name: Real test - start ALAS GUI
        working-directory: AzurLaneAutoScript
        run: |
          set -euo pipefail
      
          pixi run python gui.py > alas.log 2>&1 &
          ALAS_PID=$!
      
          echo "ALAS started with PID: ${ALAS_PID}"
      
          # Give ALAS time to initialize.
          sleep 60
      
          # If the process already exited, this is a real startup failure.
          if ! kill -0 "${ALAS_PID}" 2>/dev/null; then
            echo "ALAS exited during startup."
            echo "===== alas.log ====="
            cat alas.log
            exit 1
          fi
      
          echo "ALAS is still running after 60 seconds."
          echo "===== alas.log ====="
          cat alas.log
      
          # Stop the long-running GUI process so the workflow can finish.
          kill "${ALAS_PID}"
          wait "${ALAS_PID}" || true
